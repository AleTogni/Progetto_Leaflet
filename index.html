<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>progetto-leaflet</title>
  
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
     <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
    </div>

    <div id="legend" style="position:absolute;bottom:30px;left:10px;z-index:1000;background:white;padding:10px;border-radius:8px;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.2);">
  <b>Legenda Terremoti</b><br>
  <div style="margin:4px 0;">
    <span style="display:inline-block;width:18px;height:18px;background:red;border-radius:50%;vertical-align:middle;"></span>
    <span style="margin-left:6px;">= Terremoto recente</span>
  </div>
  <div style="margin:4px 0;">
    <span style="display:inline-block;width:18px;height:18px;background:yellow;border-radius:50%;vertical-align:middle;border:1px solid #ccc;"></span>
    <span style="margin-left:6px;">= Terremoto più vecchio</span>
  </div>
  <div style="margin:4px 0;">
    <span style="display:inline-block;width:18px;height:18px;background:red;border-radius:50%;vertical-align:middle;border:2px solid black;"></span>
    <span style="margin-left:6px;">= Cerchio più grande: magnitudo maggiore</span>
  </div>
</div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
